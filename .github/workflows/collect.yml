# Keeps NWS station observations (NWS serves only about 7 days) on the `data` branch.
# Only this workflow commits to `data`. It installs nothing (stdlib only) so a run stays well under a minute.
name: Collect observations

on:
  schedule:
    - cron: "17 * * * *" # hourly, off the top of the hour when GitHub is busiest
  workflow_dispatch:

permissions:
  contents: write # push to the data branch
  actions: write # re-enable this workflow (keep-alive step below)

concurrency:
  group: collect-observations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the data branch
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" data >/dev/null; then
            git clone --depth 1 --branch data "$REMOTE" data
          else
            git init -q -b data data
            git -C data remote add origin "$REMOTE"
          fi

      - name: Collect
        env:
          PYTHONPATH: src
        run: python3 -m weather_observations --stations stations.toml --data-dir data

      - name: Commit and push
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -q -m "Observations up to $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git push origin data && exit 0
            git pull --rebase origin data
          done
          exit 1

      # GitHub disables scheduled workflows in a public repo after 60 days without repository activity, and does
      # not say whether a bot's data commits count. Re-enabling the workflow through the API on every run restarts
      # that clock without making any commits. A failure here only warns: it must never fail a collection.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect.yml --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not re-enable the schedule."

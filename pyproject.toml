[project]
name = "weather-observations"
version = "0.1.0"
description = "Keeps NWS weather station observations, which NWS serves for only about a week."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["weather_observations"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL", "RUF", "ANN"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR"]
